name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish EmailStudio.csproj -c Release -o publish
      - name: Configure site base path
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          name = os.environ["REPOSITORY_NAME"]
          base = "/" if name.lower().endswith(".github.io") else f"/{name}/"
          index = Path("publish/wwwroot/index.html")
          html = index.read_text(encoding="utf-8")
          index.write_text(html.replace('<base href="/" />', f'<base href="{base}" />'), encoding="utf-8")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
